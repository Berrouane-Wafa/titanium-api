<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Test Titanium API</title>
</head>

<body>

    <h1>Test de mon API</h1>

    <button id="btnPost">Créer un produit</button>
    <button id="btnPatch">Modifier le produit</button>
    <button id="btnDelete">Supprimer le produit</button>

    <h2>Réponse du serveur :</h2>

    <pre id="result"></pre>

    <script>

        const result = document.getElementById("result");


        // POST
        document.getElementById("btnPost").addEventListener("click", async () => {

            const response = await fetch("http://localhost:3000/api/products", {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                "name": "Veste Grise",
                "price": 9000
            })
            });

            const data = await response.json();

            result.textContent = JSON.stringify(data, null, 2);
        });


        // PATCH
        document.getElementById("btnPatch").addEventListener("click", async () => {

            const response = await fetch("http://localhost:3000/api/products/21", {
                method: "PATCH",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({   
                    "name" : "Veste en jean"  ,  
                    "price": 4500,                    
                })
            });

            const data = await response.json();

            result.textContent = JSON.stringify(data, null, 2);
        });


        // DELETE
        document.getElementById("btnDelete").addEventListener("click", async () => {

            const response = await fetch("http://localhost:3000/api/products/20", {
                method: "DELETE"
            });

            result.textContent = "Status : " + response.status;
        });

    </script>

</body>
</html>
